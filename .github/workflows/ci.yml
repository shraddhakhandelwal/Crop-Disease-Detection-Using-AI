name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          
      - name: Run tests
        run: |
          python -m pytest -q
          
      - name: Security check - Dependencies
        run: |
          pip install safety
          safety check

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build TF-base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.tf
          push: false
          tags: crop-detect-tfbase:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container
        run: |
          docker run -d --name test-container -p 5000:5000 crop-detect-tfbase:test
          sleep 10
          curl -f http://localhost:5000/ || exit 1
